name: Release
# Builds claude-smart-notifier.mcpb and publishes a GitHub Release
# whenever the version in manifest.json changes on main (or on manual run).
on:
  push:
    branches: [main]
    paths: [manifest.json]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - id: v
        run: echo "version=$(node -p "require('./manifest.json').version")" >> "$GITHUB_OUTPUT"
      - id: exists
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          if gh release view "v${{ steps.v.outputs.version }}" >/dev/null 2>&1; then echo "yes=true" >> "$GITHUB_OUTPUT"; else echo "yes=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.exists.outputs.yes == 'false'
        run: |
          npx -y @anthropic-ai/mcpb validate manifest.json
          mkdir -p dist && npx -y @anthropic-ai/mcpb pack . dist/claude-smart-notifier.mcpb
      - if: steps.exists.outputs.yes == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Claude Smart Notifier v${{ steps.v.outputs.version }}
          files: dist/claude-smart-notifier.mcpb
          generate_release_notes: true
          make_latest: true
