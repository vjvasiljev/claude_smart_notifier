name: Release
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npx -y @anthropic-ai/mcpb validate manifest.json
      - run: mkdir -p dist && npx -y @anthropic-ai/mcpb pack . dist/claude-smart-notifier.mcpb
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/claude-smart-notifier.mcpb
          generate_release_notes: true
